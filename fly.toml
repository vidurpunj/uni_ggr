# fly.toml app configuration file generated for uni-ggr on 2026-11-27T17:42:05Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'uni-ggr'
primary_region = 'iad'
console_command = '/rails/bin/rails console'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
